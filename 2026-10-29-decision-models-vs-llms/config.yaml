  # ---- Follow-up control arms (HANDOFF-2.md), added 2026-10-29 ----
  # Endpoint listing re-resolved live on 2026-10-29 from GET /api/v1/models/qwen/qwen3.5-9b/endpoints:
  # parasail/bf16 is still 0.10 / 0.25 per million and lists reasoning, include_reasoning, logprobs, top_logprobs,
  # logit_bias, seed and temperature. Other bf16 endpoints that day, kept as fallbacks only if Parasail cannot be
  # made to think: primeintellect/bf16 (0.051 / 0.075; reasoning, no logprobs) and deepinfra/bf16 (0.10 / 0.15;
  # reasoning, logit_bias, no logprobs). Per-arm `scope` limits which tiers and whether the label-swap subset run;
  # the runner applies it on top of the CLI filters so one --models invocation covers all three arms.
  qwen3.5-9b-reasoning:
    arm: 10
    kind: reasoning
    role: control-9b-reasoning
    slug: qwen/qwen3.5-9b
    canonical_slug: qwen/qwen3.5-9b-20260310
    name: "Qwen: Qwen3.5-9B (thinking on)"
    status: selected
    context_length: 262144
    provider: {order: ["parasail/bf16"], allow_fallbacks: false, require_parameters: true}
    pricing: {prompt: "0.0000001", completion: "0.00000025"}
    price_per_million: {prompt: 0.10, completion: 0.25}
    model_list_price_per_million: {prompt: 0.17, completion: 0.25}
    supports: {logprobs: true, top_logprobs: true, logit_bias: true, temperature: true, seed: true}
    temperature: 0
    seed: 20261029
    tokenizer: Qwen3
    reasoning: {enabled: true}       # Qwen3.5 thinking mode via OpenRouter's unified flag (dry-06: thinking present, 638-3944 tokens)
    # Raised from the shared 6000 after dry-07-followup-t2 (2026-10-30): 1 of 5 tier-2 dry items used all 6000 tokens
    # thinking and never answered. A truncated control understates reasoning accuracy; a capped call costs at most $0.003.
    reasoning_max_tokens: 12000
    logprobs: true                   # ask for token logprobs; the answer token's distribution is recorded in parse_extra only
    top_logprobs: 5                  # kept small: logprobs come back for every generated token of a long reply
    pairs_with: qwen3.5-9b           # second base for the 9B matched pairs: head minus reasoning-base (elephant-1, microsoft-decision-1)
    scope: {tiers: [1, 2, 3], labelswap: true}
  qwen3.5-9b-prompt-b:
