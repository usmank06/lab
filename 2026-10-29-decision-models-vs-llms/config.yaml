    status: dropped
    drop_reason: "was the cheaper frontier candidate ($0.0058/call); replaced on the user's request by a standard-tier OpenAI model (see gpt-6.1-sol / gpt-6.1-terra / gpt-6-luna)"
    context_length: 1050000
    pricing: {prompt: "0.00001", completion: "0.00005", input_cache_read: "0.000001", input_cache_write: "0.0000125"}
    price_per_million: {prompt: 10.0, completion: 50.0}
    supports: {logprobs: false, top_logprobs: false, logit_bias: false, temperature: false, seed: true}
    seed: 20261029
    reasoning: {effort: medium}   # mandatory reasoning; supported efforts max/xhigh/high/medium/low

  # Standard-tier OpenAI candidates for arm 9 (added 2026-10-29 on the user's request to replace Astra with a cheaper,
