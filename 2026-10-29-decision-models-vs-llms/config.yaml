    pricing: {prompt: "0.0000001", completion: "0.00000025"}
    price_per_million: {prompt: 0.10, completion: 0.25}
    model_list_price_per_million: {prompt: 0.17, completion: 0.25}
    supports: {logprobs: true, top_logprobs: true, logit_bias: true, temperature: true, seed: true}
